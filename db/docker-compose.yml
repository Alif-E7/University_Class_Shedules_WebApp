services:
  postgres:
    image: postgres:16-alpine
    container_name: university_schedule_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: schedule_admin
      POSTGRES_PASSWORD: schedule_secret
      POSTGRES_DB: university_schedule
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
